# Release workflow for culipulse/terraform-provider-culipulse.
#
# This file lives in the CuliPulse monorepo at terraform-provider/.github/workflows/release.yml, where
# GitHub ignores it (only the repository-root .github/ is read). It becomes active only in the public
# mirror repo, where the monorepo's publish workflow pushes a vX.Y.Z[-rcN] tag with a PAT.
#
# Based on hashicorp/terraform-provider-scaffolding-framework .github/workflows/release.yml
# (commit ce6992fa2f5135a5f7071b9690f18a5352e40fb3, 2026-09-07); action SHAs identical to it.
name: Release

on:
  push:
    tags:
      - "v*"

# Creating a release and uploading its assets is a contents write.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    # Only the real repo holds the signing key; forks and the monorepo copy never release.
    if: github.repository == 'culipulse/terraform-provider-culipulse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # Build exactly the tag that fired this run. Without it, goreleaser picks the
          # highest-sorting tag on HEAD, and git sorts v0.1.0-rc1 above v0.1.0, so a final
          # release on the same commit as its rc would rebuild the rc.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
